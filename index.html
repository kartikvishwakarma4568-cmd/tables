<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>how to use tables</title>
</head>
<body>
    <h1>Table in html</h1>
    <table border = "6" bordercolour = "red" cellspacing="1" cellpadding="18" width = "100%">
    <!--row - <tr></tr>
    coll - <td></td> -->

    <tr>
        <td rowspan = "2">Name</td>
        <td>class</td>
        <td>roll no</td>
        <td>marks</td>
    </tr>

    <!-- row 2 -->

    <tr>
        <td colspan="2">10th</td>
        <td>1</td>
        <td>77</td>
    </tr>
    
    <!-- row 3-->
     <tr>
        <td>martin</td>
        <td>10th</td>
        <td>2</td>
        <td>56</td>
     </tr>

     </table>
     <hr>

</body>
</html>
